---
layout: default
# All the Concepts
---

{% include lang.html %}

{% assign all_concepts = site.posts | where_exp: "item", "item.hidden != true and item.tags contains 'concept'" %}

<div id="tags" class="d-flex flex-wrap mx-xl-2">
  {% for post in all_concepts %}
    <div>
      <a class="tag" href="{{ post.url relative_url }}">
        {{ post.title }}
      </a>
    </div>
  {% endfor %}
</div>
